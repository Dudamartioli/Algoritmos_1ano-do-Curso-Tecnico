<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 7, ex 10</title>
</head>
<body>
    <!--
    Faça um programa para calcular a soma de todos os números pares de 0 até um número positivo informado pelo usuário.
    -->
    <h1>Soma de todos os números pares até o número informado</h1>
    <label for="inputn">Número</label>
    <input type="number" id="inputn" placeholder="digite aqui">
    <br>
    <input type="button" value="somar" onclick="fsomar()">
    <br>
    <span id="resp">...</span>

    <script>
        function fsomar(){
            debugger
            let n=parseInt(document.getElementById("inputn").value)
            let contapar = 0
            for(let i=1; i<=n; i++){
                if(i%2 == 0){
                    contapar= contapar + i
                }
            }
            document.getElementById("resp").innerHTML=contapar
        }
    </script>
</body>
