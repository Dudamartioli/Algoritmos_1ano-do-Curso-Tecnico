<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 7, ex 7</title>
</head>
<body>
    <!--
    Crie um programa que recebe uma string do usuário e a imprime invertida.
    -->
    <h1>Inverter</h1>
    <label for="inputn">Palavra</label>
    <input type="text" id="inputn" placeholder="escreva aqui">
    <br>
    <input type="button" value="Inverter" onclick="finverter()">
    <br>
    <label for="resp"></label>
    <span id="resp">...</span>

    <script>
        function finverter(){
            debugger
            let palavra=document.getElementById("inputn").value;
            let Inverter=""
            for(let i=palavra.length-1; i>=0; i--) {
                Inverter = Inverter + palavra[i]
            }
            document.getElementById("resp").innerHTML=Inverter
        }
    </script>

</body>
</html>
