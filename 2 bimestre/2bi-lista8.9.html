<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 8, ex 9</title>
</head>
<body>
    <!--
    Desenvolver um algoritmo que efetue a soma de todos os números ímpares que são múltiplos de três 
    e que se encontram no conjunto dos números de 1 até 500.
    -->
    <h1>Soma de todos os números ímpares que são múltiplos de três 
    e que se encontram no conjunto dos números de 1 até 500</h1>
    <input type="button" value="somar" onclick="fsomar()">
    <br>
    <span id="resp"></span>

    <script>
        function fsomar(){
            let resp=0
            for(let i=1; i<=500; i++){
                if(i%2 != 0){
                    if(i%3==0){
                        resp= resp + i
                    }
                }
            }
            document.getElementById("resp").innerHTML=resp
        }
    </script>
</body>
</html>
