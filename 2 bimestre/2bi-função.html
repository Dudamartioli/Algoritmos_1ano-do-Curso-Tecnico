<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função</title>
</head>
<body>
    <h1>F(x)= math.sqrt(x**2 + 5)</h1>
    <label for="inputx">Qual o valor de X?</label>
    <input type="number" id="inputx">
    <br>
    <input type="button" value="calcular" onclick="funcaof()">
    <br>
    <label for="resp"></label>
    <span id="resp"></span>

    <script>
        function funcaof() {
            let x = parseFloat(document.getElementById("inputx").value)
            let r= f(x)
        }
        function f(x) {
            let resp= Math.sqrt(x**2 + 5)
            document.getElementById("resp").innerHTML=resp
        }
    </script>
</body>
</html>
