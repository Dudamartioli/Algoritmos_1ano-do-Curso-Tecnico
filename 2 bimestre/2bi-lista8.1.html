<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 8, ex 1</title>
</head>
<body>
    <!--
    Desenvolva um algoritmo que conte o número de palavras em uma string.
    -->
    <h1>Contar quantas palavras tem uma frase</h1>
    <input type="text" id="inputf" placeholder="digite aqui">
    <br>
    <input type="button" value="contar" onclick="fcontar()">
    <br>
    <span id="resp">...</span>

    <script>
        function fcontar(){
            debugger
            let p=document.getElementById("inputf").value;
            let espacos=" "
            let resp=1
            for(let i=0; i<p.length; i++){
                if(p[i]==espacos){
                    resp= resp + 1
                }
            }
            document.getElementById("resp").innerHTML=resp
        }
    </script>
</body>
</html>
