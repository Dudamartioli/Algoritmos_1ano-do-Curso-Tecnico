<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 7, ex. 3</title>
</head>
<body>
    <!--
    Crie um programa que solicita ao usuário um número inteiro positivo e, em seguida, soma todos os números de 1 até esse número.
    -->
    <h1>Soma de todos os números de 1 até o número informado</h1>
    <label for="inputn">Número</label>
    <input type="number" id="inputn" placeholder="digite aqui">
    <br>
    <input type="button" value="somar" onclick="fsomar()">
    <br>
    <label for="resp"></label>
    <span id="resp"></span>

    <script>
        function fsomar() {
            debugger
            let n= parseFloat(document.getElementById("inputn").value)
            let soma = 0
            for(let i=0; i<=n; i++){
                soma = soma + i
            }
            document.getElementById("resp").innerHTML=soma
        }

    </script>

</body>
</html>
