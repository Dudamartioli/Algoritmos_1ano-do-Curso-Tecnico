<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número primo</title>
</head>
<body>
    <h1>O número é primo?</h1>
    <label for="inputn">Número</label>
    <input type="number" id="inputn" placeholder="digite aqui">
    <br>
    <input type="button" value="descobrir" onclick="fdescobrir()">
    <br>
    <label for="resp"></label>
    <span id="resp">...</span>

    <script>
        function fdescobrir() {
            debugger;
            let n = parseInt(document.getElementById("inputn").value)
            let conte = 0
            let resp = 0
            for(let i=1; i<=n; i++){
                if(n%i == 0){
                    conte = conte + 1
                }
            }
            if(conte == 2){
                resp= "é primo"
            }else{
                resp= "não é primo"
            }
            document.getElementById("resp").innerHTML=resp
        }
    </script>

</body>
</html>
