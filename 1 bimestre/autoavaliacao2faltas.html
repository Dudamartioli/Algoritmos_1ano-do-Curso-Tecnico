<!DOCTYPE html>
<html lang="en">
<head>

    <title>Autoavaliação 2, ex. 2</title>
</head>
<body>

    <br>

            let nota=parseInt(document.getElementById("inputn").value);
            let resposta;
            if(nota>=9.0&&nota<=10.0&&faltas<=20){
                resposta="A"
            }else if(nota>=9.0&&nota<=10.0&&faltas>20){
                resposta="B"
            }else if(nota>=7.5&&nota<=8.9&&faltas<=20){
                resposta="B"
            }else if(nota>=7.5&&nota<=8.9&&faltas>20){
                resposta="C"
            }else if(nota>=5.0&&nota<=7.4&&faltas<=20){
                resposta="C"
            }else if(nota>=5.0&&nota<=7.4&&faltas>20){
                resposta="D"
            }else if(nota>=4.0&&nota<=4.9&&faltas<=20){
                resposta="D"
            }else if(nota>=4.0&&nota<=4.9&&faltas>20){
                resposta="E"
            }else if(nota>=0.0&&nota<=3.9&&faltas<=20){

            }else{
                resposta="E"
            }
            document.getElementById("resposta").innerHTML = resposta
        }
    </script>
</body>
</html>
