<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoavaliação 2, ex.3</title>
</head>
<body>
    <h1>Descubra a sua categoria na nataçã</h1>
    <label for="inputi">Idade</label>
    <input type="number" id="inputi">
    <br>
    <input type="button" value="descobrir" onclick="fdescobrir()">
    <br>
    <label for="resp">A sua categoria é:</label>
    <span id="resp"></span>

    <script>
        function fdescobrir(){
            let idade=parseInt(document.getElementById("inputi").value);
            let resp=0;
            if(idade>=5&&idade<=7){
                resp="infantil A"
            }else if(idade>=8&&idade<=10){
                resp="infantil B"
            }else if(idade>=11&&idade<=13){
                resp="juvenil A"
            }else if(idade>=14&&idade<=17){
                resp="juvenil B"
            }else{
                resp="senior"
            }
            document.getElementById("resp").innerHTML=resp
        }
    </script>
</body>
</html>
