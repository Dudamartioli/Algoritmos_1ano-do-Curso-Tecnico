<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>PA2, 08/04/2025</title>
</head>
<body>
    <label for="inputx">Valor de X</label>
    <input type="number" name="inputx" id="inputx">
    <br>
    <input type="button" value="calcular" onclick="fcalcular()">
    <br>
    <label for="r1">X ao quadrado =</label>
    <span id="r1"></span>
    <br>
    <label for="r2">X ao cubo =</label>
    <span id="r2"></span>
    <br>
    <label for="r3">Raiz quadrada de X =</label>
    <span id="r3"></span>
    <br>
    <label for="r4">Raiz cubica de X =</label>
    <span id="r4"></span>

    <script>
        function fcalcular() {
            let x = parseFloat(document.getElementById("inputx").value);
            let xq = x**2;
            let xc = x**3;
            let rqx = Math.sqrt(x);
            let rcx = x**(1/3);
            document.getElementById("r1").innerHTML = xq;
            document.getElementById("r2").innerHTML = xc;
            document.getElementById("r3").innerHTML = rqx;
            document.getElementById("r4").innerHTML = rcx;
        }
    </script>
</body>
</html>
