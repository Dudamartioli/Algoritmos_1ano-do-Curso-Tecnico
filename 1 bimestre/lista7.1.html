<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 7, ex.1</title>
</head>
<body>
    <h1>IMC (Índice de Massa Corporal)</h1>
    <label for="inputp">Peso</label>
    <input type="number" id="inputp">
    <br>
    <label for="inputa">Altura</label>
    <input type="number" id="inputa"> 
    <br>
    <input type="button" value="calcular" onclick="fcalcular()">
    <br>
    <label for="resp"></label>
    <span id="resp"></span>

    <script>
        function fcalcular() {
            let p=parseFloat(document.getElementById("inputp").value)
            let a=parseFloat(document.getElementById("inputa").value)
            let resp= p/(a**2)
            let IMC
            if(resp<=18.5){
                IMC="abaixo do peso"
            }else if(resp>=18.6&&resp<=24.9){
                IMC="com o peso ideal, parabéns!!"
            }else if(resp>=25.0&&resp<=29.9){
                IMC="levemente acima do peso"
            }else if(resp>=30.0&&resp<=34.9){
                resp="com obesidade grau 1"
            }else if(resp>=35.0&&resp<=39.9){
                resp="com obesidade grau 2 (severa)"
            }else{
                resp="com obesidade grau 3 (móbida)"
            }
            document.getElementById("resp").innerHTML= "O seu IMC é " + resp + ", vc está " + IMC
        }
    </script>
</body>
</html>
