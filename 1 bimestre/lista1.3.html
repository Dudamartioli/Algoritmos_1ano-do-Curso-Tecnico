<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 1, ex 3</title>
</head>
<body>
    <!--
    Faça um algoritmo que calcule a hipotenusa. Usar fórmula de Pitágoras. $$ h = \sqrt{b²+c²}$$
    -->
    <h1>Cálculo da hipotenusa</h1>
    <label for="inputc1">Cateto 1</label>
    <input type="number" name="inputc1" id="inputc1">
    <br>
    <label for="inputc2">Cateto 2</label>
    <input type="number" name="inputc2" id="inputc2">
    <br>
    <input type="button" value="calcular" onclick="fhipotenusa()">
    <br>
    <label for="hipotenusa">Hipotenusa =</label>
    <span id="hipotenusa"></span>

    <script>
        function fhipotenusa() {
            let c1 = parseFloat(document.getElementById("inputc1").value)
            let c2 = parseFloat(document.getElementById("inputc2").value)
            let hipotenusa = c1**2 + c2**2
            document.getElementById("hipotenusa").innerHTML = hipotenusa
        }
    </script>
</body>
</html>
