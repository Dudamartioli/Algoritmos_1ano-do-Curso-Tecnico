<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 5, ex. 11</title>
</head>
<body>
    <!--
    Crie um algoritmo que determine se um número é divisível por 3 e por 5 ao mesmo tempo.
    -->
    <h1>Veja se o número é divisível por 3 e 5 ao mesmo tempo!</h1>
    <label for="inputn1">Valor</label>
    <input type="number" id="inputn1">
    <br>
    <input type="button" value="calcular" onclick="fcalcular()">
    <br>
    <label for="resp">O valor é divisível por 3 e 5 ao mesmo tempo:</label>
    <span id="resp"></span>

    <script>
        function fcalcular() {
            let n1=parseFloat(document.getElementById("inputn1").value)
            let resp
            if(n1%3==0&&n1%5==0){
                resp="sim"
            }else{
                resp="não"
            }
            document.getElementById("resp").innerHTML=resp
        }
    </script>
</body>
</html>
